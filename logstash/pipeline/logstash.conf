input {
  http {
    host => "::"
    port => 8080
    codec => json
  }
  tcp {
    host => "::"
    port => 5000
    codec => json_lines
  }
}
filter {
  if ![app_name] {
    mutate { add_field => { "app_name" => "unknown-service" } }
  }
  mutate {
    remove_field => ["headers", "@version"]
  }
}
output {
  elasticsearch {
    hosts => ["${ELASTIC_HOSTS}"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "logs-%{[app_name]}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
